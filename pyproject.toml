[project]
name = "indian-portfolio-intelligence"
version = "0.1.0"
description = "Indian Market Portfolio Intelligence & Backtesting Platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "celery>=5.3",
    "redis>=5.0",
    "pandas>=2.1",
    "numpy>=1.26,<2",
    "pyarrow>=15.0",
    "yfinance>=0.2.40",
    "nsepython",
    "vectorbt",
    "hmmlearn>=0.3.0",
    "scikit-learn>=1.4",
    "ta>=0.11.0",
    "statsmodels>=0.14",
    "scipy>=1.11",
    "plotly>=5.20",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ml = [
    "tensorflow-cpu>=2.15",
    "torch>=2.2",
    "shap>=0.44",
]
dev = [
    "ruff>=0.3",
    "mypy>=1.9",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pandas",
    "yfinance",
    "nsepython",
    "vectorbt",
    "hmmlearn.*",
    "sklearn.*",
    "scipy.*",
    "ta.*",
    "app.features.indicators",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: slow or network-dependent tests",
]
